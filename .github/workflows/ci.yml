name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Tests + coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: app/coverage/frontend/
          retention-days: 14

  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            rag/requirements.txt
            app/backend/tests/requirements.txt

      - name: Install RAG dependencies (CPU-only torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r rag/requirements.txt

      - name: Install test dependencies
        run: pip install -r app/backend/tests/requirements.txt

      - name: Run pytest
        run: pytest app/backend/tests/unit --junitxml=junit.xml

      - name: Publish test report
        if: always()
        uses: dorny/test-reporter@v3.0.0
        with:
          name: Backend tests
          path: junit.xml
          reporter: java-junit

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: htmlcov/
          retention-days: 14

  system-tests:
    name: System tests (E2E)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: app/frontend
        run: npm ci

      - name: Install Playwright (Chromium)
        working-directory: app/frontend
        run: npx playwright install --with-deps chromium

      - name: Start test stack (mongo + seed + lean backend + frontend)
        run: docker compose -f docker-compose.test.yml up -d --build --wait

      - name: Run E2E tests
        working-directory: app/frontend
        run: npm run test:e2e

      - name: Dump backend logs on failure
        if: failure()
        run: docker compose -f docker-compose.test.yml logs backend seed

      - name: Stop test stack
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: app/frontend/playwright-report/
          retention-days: 14

  publish:
    name: Build & push images
    needs: [frontend, backend, system-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backend.Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/poli-tutor:backend
            ${{ secrets.DOCKERHUB_USERNAME }}/poli-tutor:backend-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/frontend.Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/poli-tutor:frontend
            ${{ secrets.DOCKERHUB_USERNAME }}/poli-tutor:frontend-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
