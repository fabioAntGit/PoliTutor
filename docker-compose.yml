services:
  # Redis: cache de mensagens recentes da conversa
  redis:
    image: redis:alpine
    container_name: poli-tutor-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Backend: FastAPI + RAG runtime (retrieval, reranking, geração socrática)
  # O rag/src/ingestion/pipeline.py NÃO corre aqui — só o runtime de retrieval é usado.
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: poli-tutor-backend
    ports:
      - "8000:8000"
    env_file:
      - app/backend/.env
      - rag/.env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./rag:/app/rag
      - huggingface_cache:/root/.cache/huggingface

  # Frontend: React/Vite servido por Nginx
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: poli-tutor-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  # Cache dos modelos HuggingFace (bge-m3 + reranker) — persiste entre restarts
  huggingface_cache:
