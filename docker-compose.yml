services:
  redis:
    image: redis:alpine
    container_name: poli-tutor-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: poli-tutor-backend

    ports:
      - "8000:8000"

    env_file:
      - app/backend/.env
      - rag/.env
      - DynamicGr/.env

    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379

    depends_on:
      redis:
        condition: service_healthy

    restart: unless-stopped

    volumes:
      - ./app:/app/app
      - ./rag:/app/rag
      - ./DynamicGr:/app/DynamicGr
      - huggingface_cache:/root/.cache/huggingface

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile

    container_name: poli-tutor-frontend

    ports:
      - "3000:80"

    depends_on:
      - backend

    restart: unless-stopped

volumes:
  huggingface_cache: