services:
  redis:
    image: redis:alpine
    container_name: poli-tutor-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    image: politutor/poli-tutor:backend
    container_name: poli-tutor-backend
    ports:
      - "8000:8000"
    env_file:
      - app/backend/.env
      - rag/.env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - huggingface_cache:/root/.cache/huggingface

  frontend:
    image: politutor/poli-tutor:frontend
    container_name: poli-tutor-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  huggingface_cache:
